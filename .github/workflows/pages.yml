name: Publish website to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: Type yes to publish the prepared website
        required: true
        type: choice
        options:
          - no
          - yes
        default: no

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require manual publication confirmation
        env:
          CONFIRM_PUBLICATION: ${{ inputs.confirm_publication }}
        run: |
          test "$CONFIRM_PUBLICATION" = "yes" || { echo "Manual publication confirmation was not given."; exit 1; }

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site package
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
