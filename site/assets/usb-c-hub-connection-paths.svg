<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">USB-Cハブで確認する3つの接続経路</title>
  <desc id="desc">映像、データ、ノートPCへの給電について、PC、ハブ、ケーブル、接続機器それぞれの仕様が合う必要があることを示す図。</desc>
  <rect width="1200" height="660" rx="28" fill="#f4f7fb"/>
  <text x="60" y="76" font-family="sans-serif" font-size="34" font-weight="700" fill="#17324d">USB-Cハブは「経路全体」の対応を確認</text>
  <text x="60" y="116" font-family="sans-serif" font-size="20" fill="#536579">端子が挿さることと、必要な機能が使えることは別です</text>
  <g font-family="sans-serif">
    <rect x="48" y="150" width="1104" height="132" rx="18" fill="#fff" stroke="#d5e0ec"/><rect x="48" y="150" width="172" height="132" rx="18" fill="#dcecff"/>
    <text x="76" y="208" font-size="24" font-weight="700" fill="#1457a6">映像</text><text x="76" y="244" font-size="16" fill="#315778">画面を出す</text>
    <rect x="252" y="177" width="190" height="78" rx="12" fill="#f8fbff" stroke="#8eacc9"/><text x="347" y="207" text-anchor="middle" font-size="20" font-weight="700" fill="#17324d">PCのUSB-C</text><text x="347" y="235" text-anchor="middle" font-size="15" fill="#536579">映像出力に対応？</text>
    <path d="M454 216h35m-10-9 10 9-10 9" fill="none" stroke="#54718e" stroke-width="3"/>
    <rect x="500" y="177" width="190" height="78" rx="12" fill="#f8fbff" stroke="#8eacc9"/><text x="595" y="207" text-anchor="middle" font-size="20" font-weight="700" fill="#17324d">ハブ</text><text x="595" y="235" text-anchor="middle" font-size="15" fill="#536579">必要な映像方式？</text>
    <path d="M702 216h35m-10-9 10 9-10 9" fill="none" stroke="#54718e" stroke-width="3"/>
    <rect x="748" y="177" width="190" height="78" rx="12" fill="#f8fbff" stroke="#8eacc9"/><text x="843" y="207" text-anchor="middle" font-size="20" font-weight="700" fill="#17324d">ケーブル</text><text x="843" y="235" text-anchor="middle" font-size="15" fill="#536579">映像信号に対応？</text>
    <path d="M950 216h35m-10-9 10 9-10 9" fill="none" stroke="#54718e" stroke-width="3"/>
    <rect x="996" y="177" width="132" height="78" rx="12" fill="#f8fbff" stroke="#8eacc9"/><text x="1062" y="207" text-anchor="middle" font-size="20" font-weight="700" fill="#17324d">モニター</text><text x="1062" y="235" text-anchor="middle" font-size="15" fill="#536579">入力端子？</text>
    <rect x="48" y="300" width="1104" height="132" rx="18" fill="#fff" stroke="#d5e0ec"/><rect x="48" y="300" width="172" height="132" rx="18" fill="#e5f5eb"/>
    <text x="76" y="358" font-size="24" font-weight="700" fill="#247545">データ</text><text x="76" y="394" font-size="16" fill="#416850">SSDなど</text>
    <rect x="252" y="327" width="190" height="78" rx="12" fill="#fbfefc" stroke="#94bea2"/><text x="347" y="357" text-anchor="middle" font-size="20" font-weight="700" fill="#17324d">PCのUSB-C</text><text x="347" y="385" text-anchor="middle" font-size="15" fill="#536579">必要なデータ規格？</text>
    <path d="M454 366h35m-10-9 10 9-10 9" fill="none" stroke="#54718e" stroke-width="3"/>
    <rect x="500" y="327" width="190" height="78" rx="12" fill="#fbfefc" stroke="#94bea2"/><text x="595" y="357" text-anchor="middle" font-size="20" font-weight="700" fill="#17324d">ハブ</text><text x="595" y="385" text-anchor="middle" font-size="15" fill="#536579">端子と速度？</text>
    <path d="M702 366h35m-10-9 10 9-10 9" fill="none" stroke="#54718e" stroke-width="3"/>
    <rect x="748" y="327" width="190" height="78" rx="12" fill="#fbfefc" stroke="#94bea2"/><text x="843" y="357" text-anchor="middle" font-size="20" font-weight="700" fill="#17324d">ケーブル</text><text x="843" y="385" text-anchor="middle" font-size="15" fill="#536579">同じ規格に対応？</text>
    <path d="M950 366h35m-10-9 10 9-10 9" fill="none" stroke="#54718e" stroke-width="3"/>
    <rect x="996" y="327" width="132" height="78" rx="12" fill="#fbfefc" stroke="#94bea2"/><text x="1062" y="357" text-anchor="middle" font-size="20" font-weight="700" fill="#17324d">SSD</text><text x="1062" y="385" text-anchor="middle" font-size="15" fill="#536579">必要な速度？</text>
    <rect x="48" y="450" width="1104" height="132" rx="18" fill="#fff" stroke="#d5e0ec"/><rect x="48" y="450" width="172" height="132" rx="18" fill="#fff0d9"/>
    <text x="76" y="508" font-size="24" font-weight="700" fill="#9b5c08">給電</text><text x="76" y="544" font-size="16" fill="#7d5c31">PCを充電</text>
    <rect x="252" y="477" width="190" height="78" rx="12" fill="#fffdfa" stroke="#d4b17f"/><text x="347" y="507" text-anchor="middle" font-size="20" font-weight="700" fill="#17324d">充電器</text><text x="347" y="535" text-anchor="middle" font-size="15" fill="#536579">必要な出力？</text>
    <path d="M454 516h35m-10-9 10 9-10 9" fill="none" stroke="#54718e" stroke-width="3"/>
    <rect x="500" y="477" width="190" height="78" rx="12" fill="#fffdfa" stroke="#d4b17f"/><text x="595" y="507" text-anchor="middle" font-size="20" font-weight="700" fill="#17324d">ハブ</text><text x="595" y="535" text-anchor="middle" font-size="15" fill="#536579">PC向け出力？</text>
    <path d="M702 516h35m-10-9 10 9-10 9" fill="none" stroke="#54718e" stroke-width="3"/>
    <rect x="748" y="477" width="190" height="78" rx="12" fill="#fffdfa" stroke="#d4b17f"/><text x="843" y="507" text-anchor="middle" font-size="20" font-weight="700" fill="#17324d">ケーブル</text><text x="843" y="535" text-anchor="middle" font-size="15" fill="#536579">電力条件？</text>
    <path d="M950 516h35m-10-9 10 9-10 9" fill="none" stroke="#54718e" stroke-width="3"/>
    <rect x="996" y="477" width="132" height="78" rx="12" fill="#fffdfa" stroke="#d4b17f"/><text x="1062" y="507" text-anchor="middle" font-size="20" font-weight="700" fill="#17324d">PC</text><text x="1062" y="535" text-anchor="middle" font-size="15" fill="#536579">充電入力？</text>
  </g>
  <text x="60" y="625" font-family="sans-serif" font-size="18" font-weight="700" fill="#17324d">各機器の仕様表で、必要な機能が経路全体にそろうか照合しましょう。</text>
</svg>
