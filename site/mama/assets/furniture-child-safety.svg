<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 286" role="img" aria-labelledby="title desc"><title id="title">赤ちゃんの家具転倒防止｜棚・テレビ周りの見直し手順の進め方を3段階で図解</title><desc id="desc">状況を確認し、使う道具と置き場を整え、試して見直す手順</desc><rect width="640" height="286" rx="30" fill="#f3ece1"/><text x="320" y="55" text-anchor="middle" font-size="24" font-weight="700" fill="#3d473d">暮らしに取り入れる3ステップ</text><rect x="24" y="96" width="184" height="150" rx="22" fill="#fffdf9" stroke="#dfd2c1"/><circle cx="116" cy="133" r="24" fill="#8a9f7c"/><text x="116" y="141" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">1</text><text x="116" y="189" text-anchor="middle" font-size="18" font-weight="700" fill="#3d473d">1. 子どもの目線で危険を探す</text><rect x="226" y="96" width="184" height="150" rx="22" fill="#fffdf9" stroke="#dfd2c1"/><circle cx="318" cy="133" r="24" fill="#dbab73"/><text x="318" y="141" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">2</text><text x="318" y="189" text-anchor="middle" font-size="18" font-weight="700" fill="#3d473d">2. 家具とテレビを固定する</text><rect x="428" y="96" width="184" height="150" rx="22" fill="#fffdf9" stroke="#dfd2c1"/><circle cx="520" cy="133" r="24" fill="#c77f76"/><text x="520" y="141" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">3</text><text x="520" y="189" text-anchor="middle" font-size="18" font-weight="700" fill="#3d473d">3. 配置と固定具を点検する</text><path d="M 205 170 h 14" stroke="#b7a58f" stroke-width="3"/><path d="M 213 165 l 6 5 -6 5" fill="none" stroke="#b7a58f" stroke-width="3"/><path d="M 407 170 h 14" stroke="#b7a58f" stroke-width="3"/><path d="M 415 165 l 6 5 -6 5" fill="none" stroke="#b7a58f" stroke-width="3"/></svg>