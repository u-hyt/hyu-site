<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">子どものお弁当袋とカトラリー｜開けやすさ・洗いやすさで選ぶの確認図</title><desc id="desc">条件を確認し、家庭に合う方法を試して、あとから見直す3段階の図</desc><rect width="640" height="360" rx="28" fill="#e3eee7"/><text x="320" y="78" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#344a3b">迷った時の3ステップ</text><rect x="52" y="132" width="156" height="126" rx="18" fill="#fff" stroke="#779783" stroke-width="3"/><circle cx="130" cy="163" r="19" fill="#779783"/><text x="130" y="169" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">1</text><text x="130" y="211" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#36483e">確認する</text><rect x="242" y="132" width="156" height="126" rx="18" fill="#fff" stroke="#779783" stroke-width="3"/><circle cx="320" cy="163" r="19" fill="#779783"/><text x="320" y="169" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">2</text><text x="320" y="211" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#36483e">合う形にする</text><rect x="432" y="132" width="156" height="126" rx="18" fill="#fff" stroke="#779783" stroke-width="3"/><circle cx="510" cy="163" r="19" fill="#779783"/><text x="510" y="169" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">3</text><text x="510" y="211" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#36483e">続けて見直す</text><path d="M214 195h25m-8-7 8 7-8 7" fill="none" stroke="#819487" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M404 195h25m-8-7 8 7-8 7" fill="none" stroke="#819487" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="312" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#526357">家の条件に合う方法から、小さく試す</text></svg>